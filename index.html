    <meta name="theme-color" content="#0a0a0a" />
    <script>
      /* Codarox pre-paint theme: prevent dark/light flash before React mounts. */
      (() => {
        try {
          const raw = localStorage.getItem("codarox-ai-settings-v1");
          const saved = raw ? JSON.parse(raw) : {};
          const preference = saved?.theme || "system";

          const systemDark =
            window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? true;

          const dark =
            preference === "dark" ||
            (preference === "system" && systemDark);

          const theme = dark ? "dark" : "light";
          const bg = dark ? "#0a0a0a" : "#ffffff";

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.documentElement.style.backgroundColor = bg;

          document.documentElement.style.setProperty(
            "--chat-font-size",
            String(Number(saved?.fontSize || 16)) + "px"
          );

                    /* Codarox pre-paint design */
          const messageWidth =
            saved?.messageWidth ||
            "comfortable";

          const density =
            saved?.interfaceDensity ||
            "comfortable";

          const codeFontSize =
            saved?.codeFontSize ||
            "normal";


          const conversationWidths = {
            compact: "680px",
            comfortable: "760px",
            wide: "920px"
          };


          const composerWidths = {
            compact: "620px",
            comfortable: "680px",
            wide: "800px"
          };


          const codeSizes = {
            small: "11.5px",
            normal: "12.5px",
            large: "14px"
          };


          document.documentElement
            .dataset.messageWidth =
              messageWidth;

          document.documentElement
            .dataset.density =
              density;

          document.documentElement
            .dataset.codeFontSize =
              codeFontSize;


          document.documentElement
            .style.setProperty(
              "--conversation-max-width",
              conversationWidths[
                messageWidth
              ] ||
                conversationWidths
                  .comfortable
            );


          document.documentElement
            .style.setProperty(
              "--composer-max-width",
              composerWidths[
                messageWidth
              ] ||
                composerWidths
                  .comfortable
            );


          document.documentElement
            .style.setProperty(
              "--code-font-size",
              codeSizes[
                codeFontSize
              ] ||
                codeSizes.normal
            );

document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", bg);
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
          document.documentElement.style.backgroundColor = "#0a0a0a";
        }
      })();
    </script>
